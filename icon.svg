<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#4a1420"/>
      <stop offset=".55" stop-color="#22090e"/>
      <stop offset="1" stop-color="#0b0406"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#07140a"/>
      <stop offset=".18" stop-color="#1d3d22"/>
      <stop offset=".34" stop-color="#2f5a33"/>
      <stop offset=".5" stop-color="#16301a"/>
      <stop offset=".82" stop-color="#0a1a0d"/>
      <stop offset="1" stop-color="#040b05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#7a5a14"/>
      <stop offset=".3" stop-color="#f6dc8a"/>
      <stop offset=".55" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#5e430c"/>
    </linearGradient>
    <linearGradient id="label" x1="0" x2="1">
      <stop offset="0" stop-color="#b8a684"/>
      <stop offset=".3" stop-color="#f6eedb"/>
      <stop offset=".6" stop-color="#ece0c4"/>
      <stop offset="1" stop-color="#9c8a68"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a0812" stop-opacity="0"/>
      <stop offset=".2" stop-color="#3a0812" stop-opacity=".5"/>
      <stop offset="1" stop-color="#1a0307" stop-opacity=".7"/>
    </linearGradient>
    <clipPath id="body">
      <path id="bp" d="M460 132 H564 V332 c0 70 20 98 52 132 c34 36 54 70 54 128 v330 c0 22 -14 36 -36 36 H390 c-22 0 -36 -14 -36 -36 v-330 c0 -58 20 -92 54 -128 c32 -34 52 -62 52 -132 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="560" r="400" fill="url(#halo)"/>
  <!-- reflet au sol -->
  <ellipse cx="512" cy="962" rx="200" ry="22" fill="#000" opacity=".55"/>
  <ellipse cx="512" cy="958" rx="140" ry="10" fill="#d4af37" opacity=".18"/>

  <!-- bouteille -->
  <use href="#bp" fill="url(#glass)"/>
  <g clip-path="url(#body)">
    <!-- vin visible en transparence -->
    <rect x="300" y="430" width="420" height="520" fill="url(#wine)"/>
    <!-- reflets -->
    <rect x="396" y="520" width="34" height="380" rx="17" fill="url(#shine)" opacity=".5"/>
    <rect x="482" y="300" width="14" height="120" rx="7" fill="#fff" opacity=".18"/>
    <rect x="640" y="540" width="10" height="330" rx="5" fill="#fff" opacity=".12"/>
  </g>
  <use href="#bp" fill="none" stroke="#d4af37" stroke-opacity=".35" stroke-width="3"/>

  <!-- capsule dorée -->
  <rect x="454" y="112" width="116" height="178" rx="4" fill="url(#gold)"/>
  <rect x="452" y="104" width="120" height="16" rx="6" fill="#f6dc8a"/>
  <rect x="454" y="270" width="116" height="8" fill="#5e430c" opacity=".6"/>
  <rect x="454" y="160" width="116" height="4" fill="#5e430c" opacity=".45"/>

  <!-- étiquette -->
  <rect x="356" y="600" width="312" height="230" rx="6" fill="url(#label)"/>
  <rect x="372" y="614" width="280" height="202" rx="3" fill="none" stroke="#7b1e2b" stroke-width="5"/>
  <rect x="381" y="623" width="262" height="184" rx="2" fill="none" stroke="#b08a1e" stroke-width="2"/>
  <!-- grappe stylisée -->
  <g fill="#7b1e2b">
    <circle cx="496" cy="660" r="9"/><circle cx="514" cy="660" r="9"/><circle cx="532" cy="660" r="9"/>
    <circle cx="505" cy="675" r="9"/><circle cx="523" cy="675" r="9"/>
    <circle cx="514" cy="690" r="9"/>
  </g>
  <path d="M514 651 q4 -14 18 -18" stroke="#5a3a22" stroke-width="3" fill="none"/>
  <text x="512" y="748" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-size="40" font-weight="700" fill="#24160c" letter-spacing="2">DYONISOS</text>
  <line x1="440" y1="772" x2="584" y2="772" stroke="#b08a1e" stroke-width="2"/>
  <text x="512" y="800" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-size="22" font-style="italic" fill="#7b1e2b" letter-spacing="3">GRAND CRU</text>
</svg>
