<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>DYONISOS — Cave à vin 3D</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DYONISOS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold2:#f0d27a;--cream:#f3e9d2;--ink:#e9dfca;--muted:#a8997f;--bg:#0b0806;--panel:rgba(22,15,11,.94);--line:rgba(212,175,55,.22);--wine:#7b1e2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
header.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(180deg,rgba(8,5,4,.85),rgba(8,5,4,0));pointer-events:none;z-index:5}
header.top>*{pointer-events:auto}
.logo{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26px;letter-spacing:.32em;color:var(--gold);text-shadow:0 0 18px rgba(212,175,55,.35);line-height:1}
.sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#777;display:inline-block}
.dot.cloud{background:#4fae6b;box-shadow:0 0 6px #4fae6b}
.dot.local{background:#e8913a}
.actions{display:flex;gap:8px}
.ic{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(25,17,12,.75);color:var(--gold2);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ic svg{width:20px;height:20px}
.ic.on{background:rgba(212,175,55,.2);border-color:var(--gold)}
.stats{position:fixed;left:14px;top:calc(66px + env(safe-area-inset-top));font-size:12px;color:var(--muted);z-index:4;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;background:rgba(25,17,12,.7);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip b{color:var(--cream);font-weight:600}
.hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(20,14,10,.75);border:1px solid var(--line);padding:8px 14px;border-radius:999px;white-space:nowrap;z-index:3;transition:opacity .4s;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.legend{position:fixed;right:14px;top:calc(66px + env(safe-area-inset-top));z-index:4;display:none;flex-direction:column;gap:4px;font-size:11px;background:rgba(20,14,10,.8);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.legend.on{display:flex}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:57vh;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px calc(22px + env(safe-area-inset-bottom));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.tall{max-height:88vh}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:-8px auto 12px}
.close{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(40,28,20,.9);color:var(--cream);font-size:20px;line-height:1;cursor:pointer;z-index:2;margin:-6px -4px 0 8px}
@media (min-width:820px){
 .sheet{left:auto;right:16px;top:16px;bottom:16px;width:410px;max-height:none!important;border-radius:20px;border:1px solid var(--line);transform:translateX(115%)}
 .sheet .grab{display:none}
 .stats{top:76px}.legend{top:76px;right:440px}
}
h2{font-family:"Cormorant Garamond",serif;font-size:30px;line-height:1.05;margin:2px 0 4px;color:var(--cream);font-weight:700}
h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:20px 0 9px;font-weight:600}
.meta{color:var(--muted);font-size:13px;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--gold2)}
.status{margin-top:14px;border-radius:16px;padding:14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.status .lab{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:700}
.status .why{font-size:13px;color:var(--muted);margin-top:2px}
.track{position:relative;height:8px;border-radius:4px;margin:16px 0 6px;background:linear-gradient(90deg,#5b8def 0%,#4fae6b 30%,#d4af37 55%,#e8913a 80%,#7d7468 100%)}
.track .mk{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--cream);border:3px solid #1a120c;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--gold)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.src{font-size:11px;color:var(--muted);margin-top:8px;font-style:italic}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.025)}
.card.full{grid-column:1/-1}
.card .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .v{font-size:19px;font-family:"Cormorant Garamond",serif;font-weight:700;color:var(--cream);margin-top:3px}
.card .t{font-size:12.5px;color:#cfc3ab;margin-top:4px;line-height:1.45}
.pairs{display:flex;flex-wrap:wrap;gap:6px}
.pair{font-size:12.5px;padding:6px 11px;border-radius:999px;background:rgba(123,30,43,.35);border:1px solid rgba(180,60,70,.35);color:#f2d9d9}
.note{font-size:13px;color:#cfc3ab;line-height:1.55;white-space:pre-wrap}
.btns{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);font:600 14px Inter,sans-serif;cursor:pointer}
.btn.pri{background:linear-gradient(180deg,#e0bd52,#b8902a);color:#1a1108;border-color:transparent}
.btn.dan{border-color:rgba(200,70,70,.5);color:#f0a8a8}
.btn.ai{background:linear-gradient(180deg,rgba(123,30,43,.6),rgba(80,18,28,.6));border-color:rgba(200,80,90,.4)}
.btn:disabled{opacity:.5}
form .f{margin-bottom:12px}
label.l{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--cream);font:16px Inter,sans-serif;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#f0a8a8;font-size:13px;margin-top:8px;min-height:1em}
.inv-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(212,175,55,.1);cursor:pointer}
.inv-item:active{background:rgba(212,175,55,.06)}
.inv-item .d{width:10px;height:10px;border-radius:50%;flex:none}
.inv-item .n{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:700;color:var(--cream);line-height:1.1}
.inv-item .m{font-size:12px;color:var(--muted)}
.inv-item .pos{margin-left:auto;font-size:11px;color:var(--gold2);white-space:nowrap}
.ai-box{border:1px solid rgba(200,80,90,.35);border-radius:14px;padding:12px;background:rgba(123,30,43,.12)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;transition:.35s;z-index:20;background:rgba(20,14,10,.95);border:1px solid var(--gold);color:var(--cream);padding:10px 16px;border-radius:12px;font-size:13px;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;transition:opacity .8s}
#loading .logo{font-size:34px}
#loading .sub{justify-content:center;margin-top:12px}
#loading.gone{opacity:0;pointer-events:none}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.slotbadge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:7px;background:rgba(212,175,55,.15);color:var(--gold2);letter-spacing:.06em}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div class="vignette"></div>

<header class="top">
  <div>
    <div class="logo">DYONISOS</div>
    <div class="sub"><span class="dot" id="syncDot"></span><span id="caveName">Cave à vin</span></div>
  </div>
  <div class="actions">
    <button class="ic" id="btnMat" title="Maturité" aria-label="Afficher la maturité">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none" opacity=".55"/></svg>
    </button>
    <button class="ic" id="btnInv" title="Inventaire" aria-label="Inventaire">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
    </button>
    <button class="ic" id="btnCfg" title="Configurer la cave" aria-label="Configurer la cave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.2h17M3.5 14.8h17M9.2 3.5v17M14.8 3.5v17"/></svg>
    </button>
  </div>
</header>

<div class="stats" id="stats"></div>
<div class="legend" id="legend">
  <span><i style="background:#5b8def"></i>Trop jeune</span>
  <span><i style="background:#4fae6b"></i>Prêt à boire</span>
  <span><i style="background:#d4af37"></i>À son apogée</span>
  <span><i style="background:#e8913a"></i>À boire vite</span>
  <span><i style="background:#8a8278"></i>Déclin</span>
</div>
<div class="hint" id="hint">Touchez le cul d'une bouteille pour la sortir · une case vide pour ajouter</div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="grab"></div>
  <button class="close" id="sheetClose" aria-label="Fermer">×</button>
  <div id="sheetBody"></div>
</section>

<div id="toast"></div>
<div id="loading"><div><div class="logo">DYONISOS</div><div class="sub">Initialisation de la cave…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const YEAR = new Date().getFullYear();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if(!window.THREE){ $('#loading .sub').textContent='Impossible de charger le moteur 3D. Vérifiez votre connexion.'; return; }

/* ============================ SAVOIR DU VIN ============================ */
const TYPES = {
  rouge_leger:{label:'Rouge léger & fruité',ex:'Beaujolais, Gamay, Pinot noir jeune, rouges de Loire souples',temp:[13,15],garde:[1,5],glass:0x1f3a22,cap:0x8a1a2c,accent:'#8c1c2c',
    verre:'Verre ballon type Bourgogne, rempli au tiers.',
    aer:a=>'Pas besoin de carafe : ouvrez la bouteille 15 à 30 min avant le service.',
    accords:['Charcuterie & terrines','Volaille rôtie','Pizza, burger maison','Fromages à pâte molle','Cuisine du quotidien']},
  rouge_moyen:{label:'Rouge équilibré',ex:'Bourgogne, Côtes-du-Rhône, Chinon, Saint-Émilion souple',temp:[15,16],garde:[3,10],glass:0x1c3420,cap:0x6b0f1a,accent:'#7b1e2b',
    verre:'Verre universel ou type Bourgogne.',
    aer:a=> a<6?'Encore jeune : carafez 30 à 60 min pour l\'ouvrir.':'Ouvrez 1 h avant, sans carafe, pour préserver le bouquet.',
    accords:['Viandes rouges grillées','Magret de canard','Plats aux champignons','Comté, tomme, saint-nectaire']},
  rouge_charpente:{label:'Rouge charpenté de garde',ex:'Bordeaux, Hermitage, Côte-Rôtie, Madiran, Cahors, Barolo',temp:[16,18],garde:[5,20],glass:0x162b18,cap:0x4a0b14,accent:'#5e1220',
    verre:'Grand verre type Bordeaux (tulipe haute).',
    aer:a=> a<8?'Jeune et tannique : carafez 1 h 30 à 2 h avant le service.': a<15?'Carafez environ 1 h, en goûtant au fur et à mesure.':'Vin ancien : redressez la bouteille 24 à 48 h avant, puis décantez délicatement juste avant de servir (dépôt).',
    accords:['Côte de bœuf','Gigot d\'agneau','Gibier & plats en sauce','Fromages affinés']},
  blanc_vif:{label:'Blanc sec & vif',ex:'Muscadet, Sancerre, Chablis, Picpoul, Riesling sec',temp:[8,10],garde:[1,4],glass:0x7d9a4a,cap:0xe0d3a6,accent:'#8a7a2e',
    verre:'Verre tulipe de taille moyenne.',
    aer:a=>'Pas de carafe : servez frais dès l\'ouverture.',
    accords:['Huîtres & fruits de mer','Poissons grillés','Fromage de chèvre','Sushis & ceviche']},
  blanc_gras:{label:'Blanc sec ample',ex:'Meursault, Chardonnay boisé, Condrieu, Hermitage blanc, Pessac blanc',temp:[11,13],garde:[3,12],glass:0x6f7f3a,cap:0xc9a24a,accent:'#9a7a1e',
    verre:'Verre ample type Bourgogne.',
    aer:a=> a<5?'Jeune et boisé : carafez 20 à 30 min.':'Ouvrez 30 min avant, sans carafe. Évitez de trop le refroidir.',
    accords:['Volaille à la crème','Saint-Jacques, poissons en sauce','Homard & langoustines','Comté affiné']},
  liquoreux:{label:'Blanc moelleux / liquoreux',ex:'Sauternes, Coteaux du Layon, Vendanges tardives, Tokaji',temp:[7,9],garde:[5,40],glass:0xc79a3a,cap:0x8a5a1a,accent:'#a8741a',
    verre:'Petit verre tulipe.',
    aer:a=> a>20?'Pas de carafe. Un vieux liquoreux s\'apprécie un peu moins froid (10–12 °C).':'Pas de carafe : servez bien frais.',
    accords:['Foie gras','Roquefort & bleus','Tarte aux fruits jaunes','Cuisine épicée douce']},
  rose:{label:'Rosé',ex:'Provence, Tavel, Bandol rosé',temp:[8,10],garde:[0,2],glass:0xe0a29a,cap:0xd88a9a,accent:'#c0606e',
    verre:'Verre tulipe.',
    aer:a=>'Pas de carafe : servez frais dès l\'ouverture.',
    accords:['Grillades d\'été','Salades composées','Cuisine méditerranéenne','Cuisine asiatique']},
  effervescent:{label:'Champagne / effervescent',ex:'Champagne, Crémant, Franciacorta',temp:[7,9],garde:[1,5],glass:0x24402a,cap:0xd4af37,accent:'#b08a1e',
    verre:'Verre tulipe (plus aromatique que la flûte).',
    aer:a=>'Jamais de carafe. Ouvrez au dernier moment, bouteille inclinée à 45° : on tourne la bouteille, pas le bouchon.',
    accords:['Apéritif','Huîtres & crustacés','Sushis','Volaille (blanc de noirs)']},
  mute:{label:'Vin muté / doux naturel',ex:'Porto, Banyuls, Maury, Rivesaltes',temp:[14,16],garde:[5,40],glass:0x2b1a0e,cap:0x3a1f14,accent:'#6a3a1e',
    verre:'Petit verre tulipe.',
    aer:a=>'Porto Vintage : décantez 1 à 2 h (dépôt). Tawny, Banyuls, Maury : servez sans carafe.',
    accords:['Chocolat noir','Fromages bleus','Desserts aux fruits rouges','Figues & fruits secs']}
};
const REGIONS = [['Bordeaux',1.3,'bordeaux'],['Bourgogne',1,'bourgogne'],['Beaujolais',.8,'bourgogne'],['Vallée du Rhône',1.15,'bourgogne'],['Loire',.9,'bourgogne'],['Alsace',1,'alsace'],['Champagne',1,'champagne'],['Languedoc-Roussillon',.9,'bordeaux'],['Provence',.8,'bordeaux'],['Sud-Ouest',1.15,'bordeaux'],['Jura',1.3,'bourgogne'],['Savoie',.8,'bourgogne'],['Corse',.9,'bordeaux'],['Italie',1,'bordeaux'],['Espagne',1,'bordeaux'],['Portugal',1,'bordeaux'],['Allemagne',1,'alsace'],['Nouveau Monde',.9,'bordeaux'],['Autre',1,'bordeaux']];
const REG = {}; REGIONS.forEach(r=>REG[r[0]]={f:r[1],shape:r[2]});
const STATUS = {
  jeune:{lab:'Trop jeune',col:'#5b8def',ord:4},
  pret:{lab:'Prêt à boire',col:'#4fae6b',ord:2},
  apogee:{lab:'À son apogée',col:'#d4af37',ord:1},
  vite:{lab:'À boire sans tarder',col:'#e8913a',ord:0},
  declin:{lab:'Au-delà de l\'apogée',col:'#8a8278',ord:3}
};

function wineInfo(b){
  const T = TYPES[b.type] || TYPES.rouge_moyen;
  const reg = REG[b.region] || {f:1};
  const f = (b.type==='effervescent'||b.type==='rose') ? 1 : reg.f;
  const mill = parseInt(b.millesime,10) || null;
  const g0 = Math.round(T.garde[0]*f), g1 = Math.max(g0+1, Math.round(T.garde[1]*f));
  let start, end, source = 'Estimation DYONISOS (type, région, millésime)';
  if(mill){ start = mill+g0; end = mill+g1; }
  else { const by = b.added ? new Date(b.added).getFullYear() : YEAR; start = by; end = by + Math.max(2, Math.min(4, g1-g0)); source = 'Non millésimé : à boire dans les années suivant l\'achat'; }
  if(b.ai && +b.ai.apogee_debut && +b.ai.apogee_fin){ start=+b.ai.apogee_debut; end=+b.ai.apogee_fin; source='Avis du sommelier IA'; }
  if(+b.boireDe || +b.boireA){ start = +b.boireDe || start; end = +b.boireA || end; source='Votre garde personnalisée'; }
  if(end < start){ const t=start; start=end; end=t; }
  const span = Math.max(1, end-start), peak = start + Math.round(span*0.55), tol = Math.max(1, Math.round(span*0.15));
  let st, why;
  if(YEAR < start){ st='jeune'; why=`Patience : idéalement à partir de ${start}.`; }
  else if(YEAR > end){ st='declin'; why=`Fenêtre idéale terminée en ${end}. À ouvrir rapidement, sans trop d'attentes.`; }
  else if(YEAR >= end - tol + 1 && end-start>1){ st='vite'; why=`Fin de fenêtre prévue en ${end}. C'est le moment.`; }
  else if(Math.abs(YEAR-peak) <= tol){ st='apogee'; why='Le moment idéal pour l\'ouvrir.'; }
  else { st='pret'; why=`Déjà agréable, peut encore gagner en complexité jusque vers ${peak}.`; }
  const age = mill ? YEAR-mill : 2;
  const tmid = (T.temp[0]+T.temp[1])/2;
  let tip;
  if(tmid > 13.5){ const m = Math.max(10, Math.round((tmid-12)*12/5)*5); tip = `Sortez-la de la cave environ ${m} min avant (pièce à ~20 °C).`; }
  else if(tmid < 11){ const m = Math.round(((12-tmid)*10+10)/5)*5; tip = `Environ ${m} min au réfrigérateur, ou ${Math.max(5,Math.round(m/3/5)*5)} min dans un seau eau + glaçons.`; }
  else tip = 'Directement de la cave : elle est déjà quasiment à température.';
  return {T, start, end, peak, st, S:STATUS[st], why, source, age, mill, tip, aer:T.aer(age)};
}

const LS_KEY = 'dyonisos.v1';
let cave = {name:'Ma cave', rows:0, cols:0, history:[]};
let bottles = {};
(function loadLocal(){ try{ const d = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(d){ cave = Object.assign(cave, d.cave||{}); bottles = d.bottles||{}; } }catch(e){} })();
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({cave, bottles})); }catch(e){} }

let caveRef=null, botCol=null;
const chains = {};
function queueWrite(k, fn){
  const p = (chains[k]||Promise.resolve()).then(fn).catch(e=>{
    console.warn('db', e);
    if(e && e.code==='quota_exceeded') toast('Stockage plein : retirez quelques bouteilles dégustées de l\'historique.');
  });
  chains[k]=p; return p;
}
const clone = o => JSON.parse(JSON.stringify(o));
function persistCave(){ saveLocal(); if(caveRef){ const d=clone(cave); queueWrite('cave', ()=>caveRef.set(d)); } }
function persistBottle(key){ saveLocal(); if(botCol){ const b = bottles[key]; const d = b?clone(b):null; queueWrite('b:'+key, ()=> d ? botCol.doc(key).set(d) : botCol.doc(key).delete()); } }
function setSync(m){ const d=$('#syncDot'); d.className='dot '+m; d.title = m==='cloud'?'Synchronisé dans le cloud':'Enregistré sur cet appareil'; }
setSync('local');

async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    caveRef = db.doc('data/users/'+uid+'/cave');
    botCol = caveRef.collection('bottles');
    let caveConfirmed=false, botConfirmed=false;
    caveRef.onSnapshot(snap=>{
      if(snap.exists){
        const d = clone(snap.data()||{});
        const changed = d.rows!==cave.rows || d.cols!==cave.cols;
        cave = Object.assign({name:'Ma cave',rows:0,cols:0,history:[]}, d);
        saveLocal(); applyCave(changed);
      } else if(!snap.metadata.fromCache && !caveConfirmed && cave.rows){
        persistCave();
      }
      if(!snap.metadata.fromCache){ caveConfirmed=true; setSync('cloud'); }
    }, e=>setSync('local'));
    botCol.onSnapshot(qs=>{
      if(qs.empty){
        if(qs.metadata.fromCache) return;
        if(!botConfirmed && Object.keys(bottles).length){ botConfirmed=true; Object.keys(bottles).forEach(persistBottle); return; }
      }
      if(!qs.metadata.fromCache) botConfirmed=true;
      const nb = {}; qs.docs.forEach(d=>{ if(d.exists) nb[d.id]=clone(d.data()); });
      bottles = nb; saveLocal(); syncBottles(); refreshStats();
      if(sel && !bottles[sel.key]) closeSheet();
    }, e=>setSync('local'));
  }catch(e){ console.warn(e); }
}

function buildRack(){

const ctl = {theta:.18, phi:1.42, r:2, tx:0, ty:.5, min:.35, max:4};
const cur = {theta:.18, phi:1.42, r:2.6, tx:0, ty:.5};
function fitCamera(snap){
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();

  const hh = (H + PLINTH + .2)/2, hw = (W + .22)/2;
  const d = Math.max(hh/tanH, hw/(tanH*camera.aspect)) + .1;
  ctl.r = d; ctl.max = Math.max(1.2, d*1.8); ctl.min = .3;
  ctl.tx = 0; ctl.ty = PLINTH + H/2 + (innerWidth<820 ? .02 : 0); ctl.theta = .16; ctl.phi = 1.45;
  if(snap){ Object.assign(cur, {theta:ctl.theta, phi:ctl.phi, r:ctl.r*1.35, tx:ctl.tx, ty:ctl.ty}); }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function clampCtl(){ ctl.theta=clamp(ctl.theta,-.85,.85); ctl.phi=clamp(ctl.phi,.95,1.9); ctl.r=clamp(ctl.r,ctl.min,ctl.max); ctl.tx=clamp(ctl.tx,-W/2,W/2); ctl.ty=clamp(ctl.ty,PLINTH,PLINTH+H); }

const pts = new Map(); let gest=null, pinch=null;
function pinchState(){ const a=[...pts.values()]; return {d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1, mx:(a[0].x+a[1].x)/2, my:(a[0].y+a[1].y)/2}; }
canvas.addEventListener('pointerdown', e=>{
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1) gest={sx:e.clientX,sy:e.clientY,t:performance.now(),moved:0,multi:false,pan:e.button===2||e.shiftKey};
  else { if(gest) gest.multi=true; if(pts.size===2) pinch=pinchState(); }
});
canvas.addEventListener('pointermove', e=>{
  const p=pts.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(gest) gest.moved += Math.abs(dx)+Math.abs(dy);
  if(pts.size===1){
    if(sel){ sel.spinT += dx*.012; }
    else if(gest && gest.pan) pan(dx,dy);
    else { ctl.theta -= dx*.006; ctl.phi -= dy*.005; }
  } else if(pts.size===2 && !sel && pinch){
    const s=pinchState(); ctl.r *= pinch.d/s.d; pan(s.mx-pinch.mx, s.my-pinch.my); pinch=s;
  }

});
function endPtr(e){
  const had = pts.has(e.pointerId); pts.delete(e.pointerId);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  const hit = ray.intersectObjects(targets, false)[0];
  if(sel){
    if(hit && hit.object.userData.bottle && hit.object.userData.bottle!==sel.key){ openBottle(hit.object.userData.bottle); return; }
    if(!hit || hit.object.userData.bottle!==sel.key) closeSheet();
    return;
  }
  if(!hit){ if(sheetMode) closeSheet(); return; }
  if(hit.object.userData.bottle) openBottle(hit.object.userData.bottle);
  else if(hit.object.userData.slot) openForm(hit.object.userData.slot, null);
}

/* -- animation de sortie -- */
let sel = null;            // objet bouteille sélectionné
const moving = new Set();
let dim = 0;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const v1=new THREE.Vector3(), v2=new THREE.Vector3(), fwd=new THREE.Vector3(), right=new THREE.Vector3(), up=new THREE.Vector3();
function showPoint(o, out){
  const wide = innerWidth>=820;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const frac = wide ? .55 : .3;
  const d = o.P.L / (frac*2*tanH);
  const nx = wide ? -(426/innerWidth) : 0, ny = wide ? 0 : .52;
  camera.matrixWorld.extractBasis(right, up, fwd); fwd.negate();
  out.copy(camera.position).addScaledVector(fwd,d).addScaledVector(up, ny*d*tanH).addScaledVector(right, nx*d*tanH*camera.aspect);
  out.y -= o.P.L/2;
  return d;
}
function poseBottle(o, t){
  const tt = clamp(t,0,1);
  v1.copy(o.home); v1.z += .4;
  if(tt < .35){ o.pivot.position.lerpVectors(o.home, v1, ease(tt/.35)); o.tilt.rotation.x = 0; o.pivot.rotation.y = 0; }
  else { const u = ease((tt-.35)/.65); showPoint(o, v2); o.pivot.position.lerpVectors(v1, v2, u); o.tilt.rotation.x = u*Math.PI/2; o.pivot.rotation.y = o.spin*u; }
}

function openBottle(k){
  const b = bottles[k]; if(!b) return;
  if(sel && sel.key!==k){ const o=sel; sel=null; o.dir=-1; moving.add(o); }
  let o = objs[k]; if(!o) return;
  if(!o.label){ o.label = makeLabel(o,b); o.inner.add(o.label); if(document.fonts){ document.fonts.ready.then(()=>{ if(o.label && objs[k]===o){ o.inner.remove(o.label); o.label.material.map.dispose(); o.label = makeLabel(o,bottles[k]||b); o.inner.add(o.label);} }); } }
  o.spin = 0; o.spinT = 0; o.ring.visible=false;
  sel = o; o.dir = 1; moving.add(o);
  const camD = o.P.L / ((innerWidth>=820?.55:.3)*2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  if(ctl.r < camD + .45) ctl.r = Math.min(ctl.max, camD + .45);
  renderFiche(k);
}

let sampleNS;
async function askSommelier(k){
  const b=bottles[k]; const zone=$('#aiZone'); const btn=$('#aiBtn');

    const prompt = `Tu es un sommelier français expert. Analyse ce vin et réponds UNIQUEMENT par un objet JSON valide, sans texte autour.
Vin : ${JSON.stringify({cuvee:b.nom, domaine:b.domaine, appellation:b.appellation, region:b.region, type:TYPES[b.type].label, cepages:b.cepages, millesime:b.millesime||'non millésimé'})}

{"profil":"2 à 3 phrases sur le style attendu de cette cuvée (robe, nez, bouche)","temperature":"température de service précise et courte justification","aeration":"conseil d'aération/carafe précis pour son âge actuel","apogee_debut":2028,"apogee_fin":2038,"accords":["5 accords mets précis"],"conseil":"une astuce de dégustation concrète"}

    if(typeof sampleNS.json==='function'){ try{ v = await sampleNS.json(prompt, {modelTier:'default'}); }catch(e){ if(e && (e.code==='not_granted'||e.code==='rate_limited')) throw e; v=null; } }
    if(!v || typeof v!=='object'){ const r = await sampleNS(prompt, {modelTier:'default'}); const m = (r.text||'').match(/\{[\s\S]*\}/); v = m ? JSON.parse(m[0]) : null; }
    if(!v) throw {message:'Réponse illisible'};
    const ai = {profil:String(v.profil||''), temperature:String(v.temperature||''), aeration:String(v.aeration||''), apogee_debut:parseInt(v.apogee_debut,10)||null, apogee_fin:parseInt(v.apogee_fin,10)||null, accords:Array.isArray(v.accords)?v.accords.slice(0,6).map(String):[], conseil:String(v.conseil||''), date:new Date().toLocaleDateString('fr-FR')};
    if(!bottles[k]) return;

    toast('Fiche sommelier enregistrée.');
  }catch(e){
    console.warn(e);
    const msg = e && e.code==='not_granted' ? 'Accès au sommelier IA refusé.' : e && e.code==='rate_limited' ? 'Le sommelier est très sollicité, réessayez dans un instant.' : 'Le sommelier n\'a pas pu répondre. Réessayez.';
    if(zone && sel && sel.key===k){ const b2=$('#aiBtn'); if(b2){ b2.disabled=false; b2.textContent='Consulter le sommelier IA'; } toast(msg); }
  }
}

function emptySlotsFrom(k){
  const [r0,c0]=k.split('-').map(Number), out=[]; const N=cave.rows*cave.cols; const s=r0*cave.cols+c0;
  for(let i=0;i<N;i++){ const idx=(s+i)%N, kk=Math.floor(idx/cave.cols)+'-'+(idx%cave.cols); if(!bottles[kk]) out.push(kk); }
  return out;
}

      </div>
      <div class="f"><label class="l">Notes</label><textarea name="notes" maxlength="600" placeholder="Occasion, cadeau, impressions…">${esc(b.notes||'')}</textarea></div>
      ${editing?'':`<div class="f"><label class="l">Nombre de bouteilles (${free} cases libres)</label><input name="qte" inputmode="numeric" value="1" maxlength="3"></div>`}
      <div class="err" id="ferr"></div>
      <div class="btns"><button type="button" class="btn" id="fCancel">Annuler</button><button class="btn pri" type="submit">${editing?'Enregistrer':'Ranger en cave'}</button></div>
    </form>`, true);
  const f=$('#wf');
  const showEx=()=>{ $('#typeEx').textContent = 'Exemples : '+TYPES[f.type.value].ex; };

  $('#fCancel').onclick=()=>{ if(editing && bottles[k]) { renderFiche(k); } else closeSheet(); };
  f.onsubmit=e=>{
    e.preventDefault();

    const err=m=>{$('#ferr').textContent=m;};
    if(!g('nom')) return err('Indiquez au moins le nom du vin.');
    const mil=g('millesime'); if(mil && (!/^\d{4}$/.test(mil) || +mil<1900 || +mil>YEAR)) return err('Millésime invalide (4 chiffres, ≤ '+YEAR+').');
    for(const n of ['boireDe','boireA']){ const v=g(n); if(v && (!/^\d{4}$/.test(v) || +v<1900 || +v>2150)) return err('Années de garde invalides.'); }
    const data = Object.assign({}, editing?bottles[k]:{}, {nom:g('nom'), domaine:g('domaine'), type:f.type.value, region:f.region.value, appellation:g('appellation'), millesime:mil, cepages:g('cepages'), prix:g('prix'), boireDe:g('boireDe'), boireA:g('boireA'), notes:g('notes')});

      const now=new Date().toISOString();
      slots.slice(0,q).forEach(kk=>{ bottles[kk]=Object.assign({}, data, {added:now}); persistBottle(kk); });
      for(const kk in plates) plates[kk].material=plateMat;
      syncBottles(); refreshStats(); sheet.classList.remove('open'); sheetMode=null; $('#hint').style.opacity=1;
      toast(q>1?`${q} bouteilles rangées à partir de ${slotName(k)}.`:`Bouteille rangée en ${slotName(k)}.`);
    }
  };
}

  const hist = cave.history||[];
  openSheet('inv', `
    <h2>Inventaire</h2>
    <div class="muted">${list.length} bouteille(s), triées par urgence de dégustation.</div>
    <div class="f" style="margin-top:12px"><input id="q" placeholder="Rechercher (nom, domaine, appellation, millésime)…"></div>
    <div id="invList"></div>
    ${hist.length?`<h3>Dernières dégustations</h3>${hist.slice(0,15).map(h=>`<div class="inv-item" style="cursor:default"><span class="d" style="background:#4a3a2a"></span><div><div class="n">${esc(h.nom)}</div><div class="m">${esc([h.domaine,h.millesime].filter(Boolean).join(' · '))}</div></div><span class="pos">${esc(h.date)}</span></div>`).join('')}`:''}
  `, true);
  const draw=q=>{
    q=(q||'').toLowerCase();
    const items=list.filter(x=>!q || [x.b.nom,x.b.domaine,x.b.appellation,x.b.millesime,x.b.region,x.b.cepages].join(' ').toLowerCase().includes(q));
    $('#invList').innerHTML = items.length ? items.map(x=>`<div class="inv-item" data-k="${x.k}"><span class="d" style="background:${x.I.S.col}"></span><div><div class="n">${esc(x.b.nom)}</div><div class="m">${esc([x.b.domaine,x.b.millesime||'NV'].filter(Boolean).join(' · '))} — ${x.I.S.lab}</div></div><span class="pos">${slotName(x.k)}</span></div>`).join('') : `<div class="muted" style="padding:14px 0">${list.length?'Aucun résultat.':'La cave est vide : touchez une case pour ranger votre premier vin.'}</div>`;
    document.querySelectorAll('#invList .inv-item').forEach(el=>el.onclick=()=>openBottle(el.dataset.k));
  };
  $('#q').oninput=e=>draw(e.target.value); draw('');
}

/* --- application de la config --- */
function applyCave(rebuild){
  refreshStats();
  if(!cave.rows){ openConfig(true); return; }
  if(rebuild || !rack){ if(sel){ sel=null; } moving.clear(); buildRack(); }
  else syncBottles();
}

/* ============================ BOUCLE ============================ */
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', ()=>{ resize(); if(rack){ const keepR = ctl.r; fitCamera(false); ctl.r = Math.min(keepR, ctl.max); } });
resize();

let last = performance.now(), clock=0;
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; clock += dt;
  const a = 1 - Math.exp(-dt*9);
  for(const k of ['theta','phi','r','tx','ty']) cur[k] += (ctl[k]-cur[k])*a;
  const sp = Math.sin(cur.phi);
  camera.position.set(cur.tx + cur.r*sp*Math.sin(cur.theta), cur.ty + cur.r*Math.cos(cur.phi), cur.r*sp*Math.cos(cur.theta));
  camera.lookAt(cur.tx, cur.ty, 0);
  camera.updateMatrixWorld();
  for(const o of moving){
    o.t = clamp(o.t + o.dir*dt/1.15, 0, 1);
    if(o===sel){ o.spinT = clamp(o.spinT, -Math.PI, Math.PI); o.spin += (o.spinT + Math.sin(clock*.6)*.35 - o.spin)*Math.min(1,dt*4); }
    else o.spin *= (1-Math.min(1,dt*4));
    poseBottle(o, o.t);
    if(o.dir<0 && o.t<=0){ moving.delete(o); o.pivot.position.copy(o.home); o.tilt.rotation.x=0; o.pivot.rotation.y=0; o.ring.visible=matMode; if(o.label){ o.inner.remove(o.label); o.label.material.map.dispose(); o.label.material.dispose(); o.label.geometry.dispose(); o.label=null; } }
  }
  dim += ((sel?1:0) - dim) * Math.min(1, dt*4);
  hemi.intensity = BASE.hemi*(1-.55*dim); key.intensity = BASE.key*(1-.5*dim); fill.intensity = BASE.fill*(1-.6*dim);
  if(sel){ focus.position.copy(camera.position).add(new THREE.Vector3(.25,.35,0)); }
  focus.intensity = 1.6*dim;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ============================ DÉMARRAGE ============================ */
applyCave(true);
requestAnimationFrame(frame);
setTimeout(()=>$('#loading').classList.add('gone'), 500);
setTimeout(()=>{ if(sheetMode===null) $('#hint').style.opacity=.0; }, 9000);
initCloud();
})();
</script>
